# new.{{DOMAIN}} is the old production name. The legacy app on members' phones calls /api/ here, and the old Android app calls /pos, so those stay; every other path goes to the same path on members.{{DOMAIN}}.
# /pos must not redirect: the old Android app follows a redirect as a GET, without the POST body, and the server answers "bad op".
# 302, not 301: a browser caches a 301 almost for good.
server {
    listen 443 ssl;
    server_name new.{{DOMAIN}};
    ssl_certificate     /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    root /home/main/cg/current/cgmembers;
    access_log /var/log/nginx/new-access.log;
    error_log  /var/log/nginx/new-error.log;

    if (-f /etc/commongood-standby-web-blocked) {
        return 403;
    }

    location ^~ /api/ {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.2-fpm-main.sock;
        fastcgi_param  SCRIPT_FILENAME  $document_root/index.php;
        fastcgi_param  SCRIPT_NAME      /index.php;
        fastcgi_param  PATH_INFO        $uri;
        fastcgi_param  PHP_SELF         /index.php$uri;
        fastcgi_param  REDIRECT_URL     $scheme://$host$uri;
        fastcgi_read_timeout 900;
        client_max_body_size 10m;
    }

    location = /pos {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.2-fpm-main.sock;
        fastcgi_param  SCRIPT_FILENAME  $document_root/index.php;
        fastcgi_param  SCRIPT_NAME      /index.php;
        fastcgi_param  PATH_INFO        $uri;
        fastcgi_param  PHP_SELF         /index.php$uri;
        fastcgi_param  REDIRECT_URL     $scheme://$host$uri;
        fastcgi_read_timeout 900;
        client_max_body_size 10m;
    }

    location / {
        return 302 https://members.{{DOMAIN}}$request_uri;
    }
}
server {
    listen 80;
    server_name new.{{DOMAIN}};
    return 301 https://$host$request_uri;
}
