server {
    listen 443 ssl;
    server_name beta.{{DOMAIN}};
    include /etc/nginx/bootstrap-lock.d/beta.*;
    ssl_certificate     /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    root /home/beta/cg/current/cgmembers;
    index index.php;
    access_log /var/log/nginx/beta-cg-access.log;
    error_log  /var/log/nginx/beta-cg-error.log;

    if (-f /etc/{{ORG}}-standby-web-blocked) {
        return 403;
    }

    error_page 404 /empty;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    location /rcredits/css/ {
        try_files $uri =404;
        add_header Content-Type "text/css";
        allow all;
    }

    location /rcredits/js/ {
        try_files $uri =404;
        add_header Content-Type "application/javascript";
        allow all;
    }

    location /rcredits/rweb/chart-core.txt {
        try_files $uri =404;
        allow all;
    }

    location ~ /rcredits/images/.*\.(gif|jpeg|jpg|png|svg|tiff|ico|pdf|json)$ {
        try_files $uri =404;
        allow all;
    }

    location ~ /phpinfo\.php {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.2-fpm-beta.sock;
        fastcgi_param  SCRIPT_FILENAME  $document_root$uri;
        fastcgi_param  SCRIPT_NAME      $uri;
    }

    location /rcredits/rcron/cron.php {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.2-fpm-beta.sock;
        fastcgi_param  SCRIPT_FILENAME  $document_root$uri;
        fastcgi_param  SCRIPT_NAME      $uri;
        fastcgi_param  PATH_INFO        $uri;
        fastcgi_param  PHP_SELF         /index.php$uri;
        fastcgi_param  REDIRECT_URL     $scheme://$host$uri;
        fastcgi_read_timeout 900;
    }

    location / {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.2-fpm-beta.sock;
        fastcgi_param  SCRIPT_FILENAME  $document_root/index.php;
        fastcgi_param  SCRIPT_NAME      /index.php;
        fastcgi_param  PATH_INFO        $uri;
        fastcgi_param  PHP_SELF         /index.php$uri;
        fastcgi_param  REDIRECT_URL     $scheme://$host$uri;
        fastcgi_read_timeout 900;
        client_max_body_size 10m;
    }
}
server {
    server_name beta.{{DOMAIN}};
    listen 80;
    return 301 https://$host$request_uri;
}
