# QR cards: http://[region.]rc2.me/<type><code> -> the legacy app host /card/<region>/<type><code>
# (commented lines: what to use once pay takes over cards again)
server {
    listen 80;
    server_name "~^(?:(?<region>[^.]+)\.)?rc2\.me$";
    error_log /var/log/nginx/rc2-error.log info;
    access_log /var/log/nginx/rc2-access.log;

    if (-f /etc/commongood-standby-web-blocked) {
        return 403;
    }

    location ~ ^/(?<c1>.)(?<c2>.*)$ {
        #return 302 https://pay.main.{{DOMAIN}}/Q=CGCARD-$c1$region$c2;
        return 302 https://members.{{DOMAIN}}/card/$region/$c1$c2;
    }
    location / {
        #return 302 https://pay.main.{{DOMAIN}}/;
        return 302 https://members.{{DOMAIN}}/;
    }
}
