# QR cards: http://[region.]rc2.me/<type><code> -> pay /Q=CGCARD-<type><region><code>
server {
    listen 80;
    server_name "~^(?:(?<region>[^.]+)\.)?rc2\.me$";
    error_log /var/log/nginx/rc2-error.log info;
    access_log /var/log/nginx/rc2-access.log;

    if (-f /etc/commongood-standby-web-blocked) {
        return 403;
    }

    location ~ ^/(?<c1>.)(?<c2>.*)$ {
        return 302 https://pay.main.commongood.earth/Q=CGCARD-$c1$region$c2;
    }
    location / {
        return 302 https://pay.main.commongood.earth/;
    }
}
