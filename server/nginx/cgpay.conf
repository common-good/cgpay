# Legacy app: static files, a byte copy of the old server's app. Kept so members' phones keep their origin and offline queue.
server {
    listen 443 ssl;
    server_name cgpay.{{DOMAIN}} app.{{DOMAIN}};
    if (-f /etc/commongood-standby-web-blocked) { return 403; }
    ssl_certificate     /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /home/main/cgpay/current;
    index index.html;
    access_log /var/log/nginx/cgpay-old-access.log;
    error_log  /var/log/nginx/cgpay-old-error.log;
}
