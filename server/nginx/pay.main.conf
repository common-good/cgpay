# pay.main.{{DOMAIN}} only forwards to pay.members.{{DOMAIN}}: main's pay app answers there, because its SSO cookie is scoped to the PHP host members.{{DOMAIN}}.
# Kept for store app builds and links that still start here; $request_uri keeps the path and query.
server {
    server_name pay.main.{{DOMAIN}};
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_log   /var/log/nginx/pay.main-error.log info;
    access_log  /var/log/nginx/pay.main-access.log;

    if (-f /etc/commongood-standby-web-blocked) {
        return 403;
    }

    return 301 https://pay.members.{{DOMAIN}}$request_uri;
}
