# pay.{{DOMAIN}} only forwards to pay.members.{{DOMAIN}}: the SSO cookie is scoped to the PHP host, so the pay app cannot answer under this name.
# 302 so a changed target is not cached by browsers; $request_uri keeps the path and query of the QR attribution links (/a=..., /w=..., /q=...).
server {
    server_name pay.{{DOMAIN}};
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_log   /var/log/nginx/pay.redirect-error.log info;
    access_log  /var/log/nginx/pay.redirect-access.log;

    if (-f /etc/commongood-standby-web-blocked) {
        return 403;
    }

    return 302 https://pay.members.{{DOMAIN}}$request_uri;
}
