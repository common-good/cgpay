server {
    server_name pay.beta.commongood.earth;
    include /etc/nginx/bootstrap-lock.d/beta.*;
    error_log   /var/log/nginx/pay.beta-error.log info;
    access_log  /var/log/nginx/pay.beta-access.log;

    if (-f /etc/commongood-standby-web-blocked) {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/commongood.earth/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/commongood.earth/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
}
server {
    server_name pay.beta.commongood.earth;
    listen 80;
    return 301 https://$host$request_uri;
}
